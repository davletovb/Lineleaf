<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lineleaf</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup" data-state="loading">
  <main>
    <header class="brand">
      <span class="tile" aria-hidden="true"><svg class="ll-icon" viewBox="0 0 24 24" width="20" height="20"><path class="solid" d="M5 19C5 10.5 10.2 5 19 5c0 8.8-5.5 14-14 14z"/><path class="vein" d="M6.5 17.5 14 10"/></svg></span>
      <h1>Lineleaf</h1>
      <button id="settings" class="icon quiet" aria-label="Settings"><svg class="ll-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg></button>
    </header>

    <label class="site" for="enabled">
      <span id="avatar" class="avatar" aria-hidden="true">?</span>
      <span class="site-text"><strong id="site">Loading…</strong><span id="note" class="muted"></span></span>
      <input type="checkbox" id="enabled" role="switch" aria-label="Check my writing on this site" disabled>
    </label>

    <div id="notice" class="callout" role="status" hidden>
      <p id="notice-text"></p>
      <div class="bar"><button id="notice-ok" type="button" class="small">Got it</button></div>
    </div>
    <div id="alert" class="callout" role="status" aria-live="polite" hidden>
      <p id="status"></p>
      <div class="bar"><button id="fix" type="button" class="small primary" hidden>Open Settings</button></div>
    </div>

    <button id="open" class="primary wide" disabled>Open writing panel</button>

    <footer class="foot-row">
      <button id="connection" class="quiet small"><span id="dot" class="dot" data-state="unknown" aria-hidden="true"></span><span id="connection-label">Check Seatline</span></button>
      <button id="pause" class="quiet small" aria-pressed="false"><svg class="ll-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8.5 5.5v13M15.5 5.5v13"/></svg><span id="pause-label">Pause on all sites</span></button>
    </footer>
  </main>
  <script type="module" src="popup.mjs"></script>
</body>
</html>
