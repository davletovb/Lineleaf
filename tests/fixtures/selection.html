<script>
window.controlledState = controlled.value;
controlled.addEventListener('input', () => { window.controlledState = controlled.value; queueMicrotask(() => { controlled.value = window.controlledState; }); });
const event = () => ({listeners: [], addListener(listener) { this.listeners.push(listener); }, emit(...args) { for (const fn of this.listeners) fn(...args); }});
window.fixture = {enabled: true, hold: false, checks: [], ports: [], runtimeMessages: event(), after: 'goes'};
const runtime = {id: 'lnbkadelggojehiapgnhonicnfonobal', onMessage: fixture.runtimeMessages,
  async sendMessage() { return {ok: fixture.enabled, value: {enabled: fixture.enabled}}; },
  connect() {
    const port = {onMessage: event(), onDisconnect: event(), sent: [], closed: false}; fixture.ports.push(port);
    port.disconnect = () => { if (!port.closed) { port.closed = true; port.onDisconnect.emit(); } };
    port.result = () => {
      const request = port.sent.find(x => x.type === 'start');
      const start = request.text.indexOf('go'), edits = request.mode === 'proofread'
        ? [{before: 'go', after: fixture.after, start, end: start + 2, category: 'grammar', explanation: 'Subject agreement'}]

      port.onMessage.emit({type: 'result', id: request.id, edits});
    };
    port.postMessage = request => { port.sent.push(request); if (request.type === 'start') { fixture.checks.push(request); if (!fixture.hold) setTimeout(port.result, 10); } };
    return port;
  }};
window.chrome = {runtime};
