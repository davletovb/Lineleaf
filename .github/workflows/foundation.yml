name: Foundation validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editor-and-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Record synthetic harness evidence
        run: |
          mkdir -p test-results
          python3 -m tools.benchmark_provider --fixture > test-results/fixture-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-benchmark
          path: test-results/fixture-benchmark.json
  shared-companion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check out the audited shared Seatline revision
        uses: actions/checkout@v5
        with:
          repository: davletovb/seatline
          ref: dc1086582c8b98498aa48dae91c8d174bc3cfc3c
          path: .seatline-audit
          persist-credentials: false
      - name: Build the existing companion
        working-directory: .seatline-audit
        run: cargo build --locked --release -p seatline-companion
      - name: Validate isolated native authorization
        run: |
          mkdir -p test-results
          python3 -m tools.validate_authorization --companion .seatline-audit/target/release/seatline-companion > test-results/native-authorization.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-authorization
          path: test-results/native-authorization.json
