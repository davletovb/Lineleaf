name: Foundation validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editor-and-harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:extension
      - run: npm run package
      - name: Exercise evaluation and blocked beta-review packaging
        run: |
          node tools/evaluate-writing.mjs --fixture --out test-results/quality-fixture > test-results/quality-fixture-summary.json
          node tools/measure-typing.mjs > test-results/typing-summary.json
          node tools/package-beta.mjs --candidate > test-results/beta-review-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lineleaf-beta-review-${{ runner.os }}
          path: |
            dist/lineleaf-0.1.0-beta-review.zip
            test-results/quality-fixture-summary.json
            test-results/typing-summary.json
            test-results/beta-review-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lineleaf-extension-${{ runner.os }}
          path: dist/lineleaf-0.1.0.zip
      - name: Record synthetic harness evidence
        run: |
          mkdir -p test-results
          python3 -m tools.benchmark_provider --fixture --samples 3 > test-results/fixture-benchmark.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fixture-benchmark-${{ runner.os }}
          path: test-results/fixture-benchmark.json
  shared-companion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check out the audited shared Seatline revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: davletovb/seatline
          ref: dc1086582c8b98498aa48dae91c8d174bc3cfc3c
          path: .seatline-audit
          persist-credentials: false
      - name: Build the existing companion
        working-directory: .seatline-audit
        run: cargo build --locked --release -p seatline-companion -p seatline-tests --bins
      - name: Validate isolated native authorization
        run: |
          mkdir -p test-results
          python3 -m tools.validate_authorization --companion .seatline-audit/target/release/seatline-companion --fake-provider .seatline-audit/target/release/seatline-fake-provider > test-results/native-authorization.json
      - name: Validate isolated concurrent-consumer coexistence
        run: |
          python3 -m tools.validate_coexistence --companion .seatline-audit/target/release/seatline-companion --fake-provider .seatline-audit/target/release/seatline-fake-provider > test-results/native-coexistence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-authorization
          path: |
            test-results/native-authorization.json
            test-results/native-coexistence.json
